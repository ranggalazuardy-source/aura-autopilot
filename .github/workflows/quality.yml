name: AURA quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install and validate Python runtime dependencies
        run: uv sync --all-groups
      - name: Install and audit Virtual Office dependencies
        run: |
          npm install --prefix virtual-office --no-audit --no-fund
          npm audit --prefix virtual-office --audit-level=high
      - name: Build React Three Fiber virtual office
        run: npm run build --prefix virtual-office
      - name: Install and audit the exact Wrangler CLI used for production deploy
        run: |
          mkdir -p .deploy-tools
          echo '{"private":true}' > .deploy-tools/package.json
          npm install --prefix .deploy-tools --no-audit --no-fund --save-exact wrangler@4.165.0
          npm audit --prefix .deploy-tools --audit-level=high
          .deploy-tools/node_modules/.bin/wrangler --version
      - name: Audit Python dependencies
        run: uv run pip-audit --strict
      - name: Compile Python sources
        run: uv run python -m compileall -q app cloudflare
      - name: Validate embedded dashboard JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          source = Path("cloudflare/worker.py").read_text(encoding="utf-8")
          module = ast.parse(source)
          dashboard = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "DASHBOARD" for target in node.targets)
          )
          scripts = re.findall(r"<script>(.*?)</script>", dashboard, flags=re.DOTALL)
          assert len(scripts) == 1, f"Expected one dashboard script, found {len(scripts)}"
          Path("/tmp/aura-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/aura-dashboard.js
      - name: Run automated behavior and architecture tests
        run: uv run python -m unittest discover -s tests -v
      - name: Validate D1 schema with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("cloudflare/schema.sql").read_text(encoding="utf-8"))
          expected = {"opportunities", "approvals", "ledger", "audit_log", "agent_tasks", "task_skill_routes", "task_execution_leases", "task_execution_artifacts", "research_runs", "research_sources", "opportunity_scores", "market_comparisons", "ceo_decisions", "research_search_logs"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          assert not missing, f"Missing tables: {sorted(missing)}"
          print("D1 schema validated:", ", ".join(sorted(actual)))
          PY
      - name: Validate Cloudflare Worker deployment bundle without publishing
        run: uv run pywrangler deploy --dry-run
      - name: Build local API Docker image
        run: docker build --tag aura-local-api:quality .
