name: AURA quality checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q app cloudflare
      - name: Run skill routing tests
        run: python -m unittest discover -s tests -v
      - name: Validate D1 schema with SQLite
        run: |
          python - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("cloudflare/schema.sql").read_text(encoding="utf-8"))
          expected = {"opportunities", "approvals", "ledger", "audit_log", "agent_tasks", "task_skill_routes", "task_execution_leases", "task_execution_artifacts"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          assert not missing, f"Missing tables: {sorted(missing)}"
          print("D1 schema validated:", ", ".join(sorted(actual)))
          PY
