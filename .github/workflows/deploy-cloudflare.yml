name: Deploy AURA to Cloudflare

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Provision, migrate and deploy AURA
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AURA_API_KEY: ${{ secrets.AURA_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=("CLOUDFLARE_API_TOKEN")
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=("CLOUDFLARE_ACCOUNT_ID")
          [[ -n "$AURA_API_KEY" ]] || missing+=("AURA_API_KEY")
          if (( ${#missing[@]} > 0 )); then
            printf '::error::Missing GitHub repository secrets: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "Required deployment secrets are present."

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Wrangler with static-assets base_path support
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deploy-tools
          printf '{"private":true}\n' > .deploy-tools/package.json
          npm install --prefix .deploy-tools --no-audit --no-fund --save-exact wrangler@4.165.0
          WRANGLER_BIN="$GITHUB_WORKSPACE/.deploy-tools/node_modules/.bin"
          echo "$WRANGLER_BIN" >> "$GITHUB_PATH"
          export PATH="$WRANGLER_BIN:$PATH"
          command -v wrangler
          wrangler --version

      - name: Install Python Worker dependencies
        run: uv sync --all-groups

      - name: Install and audit Virtual Office dependencies
        run: |
          npm install --prefix virtual-office --no-audit --no-fund
          npm audit --prefix virtual-office --audit-level=high
      - name: Build Virtual Office frontend
        run: npm run build --prefix virtual-office
      - name: Audit Python dependencies
        run: uv run pip-audit --strict

      - name: Compile and test AURA
        run: |
          uv run python -m compileall -q app cloudflare
          uv run python -m unittest discover -s tests -v
      - name: Validate embedded dashboard JavaScript
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          source = Path("cloudflare/worker.py").read_text(encoding="utf-8")
          module = ast.parse(source)
          dashboard = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "DASHBOARD" for target in node.targets)
          )
          scripts = re.findall(r"<script>(.*?)</script>", dashboard, flags=re.DOTALL)
          assert len(scripts) == 1, f"Expected one dashboard script, found {len(scripts)}"
          Path("/tmp/aura-dashboard.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/aura-dashboard.js
      - name: Validate Worker bundle before changing Cloudflare resources
        run: uv run pywrangler deploy --dry-run

      - name: Provision or reuse D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          # Use Wrangler directly: pywrangler prefixes stdout with INFO lines,
          # which makes its --json output invalid for machine parsing.
          wrangler d1 list --json > /tmp/aura-d1-list.json
          DB_ID="$(node -e '
            const fs = require("fs");
            const parsed = JSON.parse(fs.readFileSync("/tmp/aura-d1-list.json", "utf8"));
            const rows = Array.isArray(parsed) ? parsed : (parsed.result || parsed.databases || []);
            const db = rows.find((item) => item.name === "aura-autopilot-db");
            process.stdout.write(db ? (db.uuid || db.database_id || "") : "");
          ')"

          if [[ -z "$DB_ID" ]]; then
            echo "Creating the AURA D1 database in the Asia-Pacific region."
            wrangler d1 create aura-autopilot-db --location apac
            wrangler d1 list --json > /tmp/aura-d1-list.json
            DB_ID="$(node -e '
              const fs = require("fs");
              const parsed = JSON.parse(fs.readFileSync("/tmp/aura-d1-list.json", "utf8"));
              const rows = Array.isArray(parsed) ? parsed : (parsed.result || parsed.databases || []);
              const db = rows.find((item) => item.name === "aura-autopilot-db");
              process.stdout.write(db ? (db.uuid || db.database_id || "") : "");
            ')"
          else
            echo "Reusing the existing AURA D1 database."
          fi

          if [[ -z "$DB_ID" ]]; then
            echo "::error::Could not resolve the D1 database UUID."
            exit 1
          fi

          export AURA_D1_DATABASE_ID="$DB_ID"
          node <<'NODE'
          const fs = require("fs");
          const path = "wrangler.jsonc";
          const config = JSON.parse(fs.readFileSync(path, "utf8"));
          const binding = (config.d1_databases || []).find((item) => item.binding === "DB");
          if (!binding) throw new Error("D1 binding DB is missing from wrangler.jsonc");
          binding.database_id = process.env.AURA_D1_DATABASE_ID;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          NODE

          echo "D1 database is ready."

      - name: Apply D1 schema
        run: wrangler d1 execute aura-autopilot-db --remote --file=cloudflare/schema.sql

      - name: Initial Worker deployment
        run: uv run pywrangler deploy

      - name: Set AURA API key as a Worker secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$AURA_API_KEY" | uv run pywrangler secret put AURA_API_KEY

      - name: Deploy the final Worker version
        shell: bash
        run: |
          set -euo pipefail
          uv run pywrangler deploy 2>&1 | tee /tmp/aura-deploy.log

      - name: Verify the public AURA hostname and routes
        shell: bash
        run: |
          set -euo pipefail
          WORKER_URL="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/aura-deploy.log | tail -n 1 || true)"
          if [[ -z "$WORKER_URL" ]]; then
            echo "::error::The deploy output did not include a workers.dev URL. Check whether the workers.dev subdomain is enabled for this account."
            exit 1
          fi

          echo "Checking $WORKER_URL"
          # Cloudflare edge propagation and Python Worker cold-start can take longer than the deploy API response.
          # Allow up to two minutes, and report the HTTP status/body for every failed probe.
          HEALTH_OK=false
          for attempt in {1..24}; do
            HEALTH_STATUS="$(curl --silent --show-error --max-time 20 -o /tmp/aura-health.json -w '%{http_code}' "$WORKER_URL/health" || true)"
            if [[ "$HEALTH_STATUS" == "200" ]] && node -e 'try { const h=JSON.parse(require("fs").readFileSync("/tmp/aura-health.json","utf8")); process.exit(h.ok===true ? 0 : 1); } catch { process.exit(1); }'; then
              HEALTH_OK=true
              break
            fi
            echo "Health check attempt $attempt/24 failed (HTTP ${HEALTH_STATUS:-no-response})."
            if [[ -s /tmp/aura-health.json ]]; then
              head -c 500 /tmp/aura-health.json
              echo
            fi
            sleep 5
          done
          if [[ "$HEALTH_OK" != "true" ]]; then
            echo "::error::AURA /health did not return HTTP 200 with {ok:true} after 24 attempts (about two minutes)."
            exit 1
          fi
          curl --fail --silent --show-error "$WORKER_URL/openapi.json" -o /tmp/aura-openapi.json
          node -e 'const s=JSON.parse(require("fs").readFileSync("/tmp/aura-openapi.json","utf8")); const key=Object.values(s.components?.securitySchemes||{}).find(x=>x.type==="apiKey"&&x.in==="header"&&x.name==="X-AURA-API-Key"); if(!key) process.exit(1)'
          UNAUTH_STATUS="$(curl --silent --show-error -o /tmp/aura-unauthorized.json -w '%{http_code}' "$WORKER_URL/opportunities")"
          if [[ "$UNAUTH_STATUS" != "401" ]]; then
            echo "::error::Expected unauthenticated /opportunities to return 401, got $UNAUTH_STATUS"
            exit 1
          fi
          OFFICE_UNAUTH_STATUS="$(curl --silent --show-error -o /tmp/aura-office-unauthorized.json -w '%{http_code}' "$WORKER_URL/office/state")"
          if [[ "$OFFICE_UNAUTH_STATUS" != "401" ]]; then
            echo "::error::Expected unauthenticated /office/state to return 401, got $OFFICE_UNAUTH_STATUS"
            exit 1
          fi
          curl --fail --silent --show-error "$WORKER_URL/" -o /tmp/aura-root.html
          grep -q "AURA" /tmp/aura-root.html
          curl --fail --silent --show-error "$WORKER_URL/dashboard" -o /tmp/aura-dashboard.html
          grep -q "AURA" /tmp/aura-dashboard.html
          curl --fail --silent --show-error "$WORKER_URL/office/" -o /tmp/aura-office.html
          grep -q "Virtual AI Office" /tmp/aura-office.html
          curl --fail --silent --show-error \
            -H "X-AURA-API-Key: $AURA_API_KEY" \
            "$WORKER_URL/office/state" > /tmp/aura-office-state.json

          # Verify the dashboard's core authenticated data endpoints, not only the virtual office.
          for endpoint in opportunities approvals content ledger ledger/summary; do
            response_file="/tmp/aura-${endpoint//\//-}.json"
            echo "Checking authenticated endpoint: /$endpoint"
            curl --fail --silent --show-error \
              -H "X-AURA-API-Key: $AURA_API_KEY" \
              "$WORKER_URL/$endpoint" -o "$response_file"
          done

          echo "WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"
          {
            echo "## AURA deployment successful"
            echo
            echo "Base URL: $WORKER_URL"
            echo
            echo "- Main dashboard: $WORKER_URL/dashboard"
            echo "- 3D Virtual Office: $WORKER_URL/office/"
            echo "- Health: $WORKER_URL/health"
            echo "- Authenticated office telemetry: verified"
          } >> "$GITHUB_STEP_SUMMARY"
