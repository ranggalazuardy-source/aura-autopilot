version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-runtime:
        patterns:
          - "fastapi"
          - "pydantic"
          - "uvicorn"
          - "sqlalchemy"
          - "psycopg"
          - "workers-py"
          - "workers-runtime-sdk"
  - package-ecosystem: "npm"
    directory: "/virtual-office"
    schedule:
      interval: "weekly"
    groups:
      virtual-office:
        patterns:
          - "react"
          - "react-dom"
          - "three"
          - "@react-three/*"
          - "vite"
          - "@vitejs/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
